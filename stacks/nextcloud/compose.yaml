services:
  nextcloud:
    image: nextcloud:33-apache
    container_name: nextcloud
    restart: on-failure

    ports:
      - "${NEXTCLOUD_HOST_PORT}:80"

    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: nextcloud-redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}

      NEXTCLOUD_ADMIN_USER: ${PRIMARY_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: "${LOCAL_IP} ${TAILSCALE_IP} ${LOCAL_HOSTNAME} nextcloud.${LOCAL_DOMAIN}"

      TZ: ${TZ}

    volumes:
      - ./data/html:/var/www/html
      - type: bind
        source: ${NEXTCLOUD_DATA_PATH:-/mnt/nas/nextcloud/data}
        target: /var/www/html/data
        bind:
          create_host_path: false

    depends_on:
      nextcloud-redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost/status.php | grep -q 'installed'" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    networks:
      - shared

  nextcloud-redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    volumes:
      - ./data/redis:/data

    networks:
      - shared

networks:
  shared:
    external: true
    name: ${SHARED_NETWORK}

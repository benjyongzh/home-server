services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped

    ports:
      - "${CADDY_HTTP_PORT}:80"
      - "${CADDY_HTTPS_PORT}:443"

    env_file:
      - ../../shared/.env

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/data:/data
      - ./data/config:/config

    networks:
      - shared

networks:
  shared:
    external: true
    name: ${SHARED_NETWORK}

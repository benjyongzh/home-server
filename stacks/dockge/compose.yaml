services:
  dockge:
    image: louislam/dockge:latest

    restart: unless-stopped

    ports:
      - "${DOCKGE_HOST_PORT}:5001"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ${STACKS_ROOT}:${STACKS_ROOT}
      - ${INSTALL_ROOT}/shared:${INSTALL_ROOT}/shared:ro

    environment:
      DOCKGE_STACKS_DIR: ${STACKS_ROOT}
      COMPOSE_ENV_FILES: ${INSTALL_ROOT}/shared/.env,.env

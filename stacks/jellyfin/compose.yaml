services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: on-failure

    ports:
      - "${JELLYFIN_HOST_PORT}:8096"

    environment:
      TZ: ${TZ}

    volumes:
      - ./data/config:/config
      - ./data/cache:/cache
      - type: bind
        source: ${MEDIA_ROOT}
        target: /media
        read_only: true
        bind:
          create_host_path: false

    networks:
      - shared

networks:
  shared:
    external: true
    name: ${SHARED_NETWORK}

name: Validate homelab configuration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-and-host-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate Compose projects with safe examples
        shell: bash
        run: |
          set -euo pipefail
          for compose_file in stacks/*/compose.y*ml; do
            stack_dir="$(dirname "$compose_file")"
            stack_env="$stack_dir/.env.example"
            docker compose \
              --project-directory "$stack_dir" \
              --env-file shared/.env.example \
              --env-file "$stack_env" \
              -f "$compose_file" config --quiet
          done

      - name: Check shell syntax
        run: |
          bash -n infra/scripts/backup-nextcloud-db.sh
          sh -n infra/scripts/check-nas-mounts.sh
          sh -n shared/compose.sh
          sh -n stacks/torrent/scripts/update-qbit-port.sh

      - name: Check whitespace
        run: git diff --check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Validate homelab configuration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-and-host-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whitespace check needs the checked-out commit's parent(s).
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Validate Compose projects with safe examples
        shell: bash
        run: |
          set -euo pipefail
          for compose_file in stacks/*/compose.y*ml; do
            stack_dir="$(dirname "$compose_file")"
            stack_env="$stack_dir/.env.example"
            # --env-file supplies tracked interpolation examples. Some services
            # also declare ignored runtime env_file paths inside Compose; do
            # not require or read those files in a clean CI checkout.
            docker compose \
              --project-directory "$stack_dir" \
              --env-file shared/.env.example \
              --env-file "$stack_env" \
              -f "$compose_file" config --no-env-resolution --quiet
          done

      - name: Check shell syntax
        run: |
          bash -n infra/scripts/backup-nextcloud-db.sh
          sh -n infra/scripts/check-nas-mounts.sh
          sh -n shared/compose.sh
          sh -n stacks/torrent/scripts/update-qbit-port.sh

      - name: Validate example NFS mount entries
        shell: bash
        run: |
          set -euo pipefail
          # findmnt --verify requires mount targets to exist. A GitHub runner
          # has no /mnt/nas directories, so check an otherwise identical copy
          # whose targets live under a disposable temporary directory.
          ci_mount_root="$(mktemp -d)"
          mkdir -p "$ci_mount_root/mnt/nas"/{data,nextcloud,backups}
          sed "s# /mnt/nas/# $ci_mount_root/mnt/nas/#g" \
            infra/examples/fstab.nas.example > "$ci_mount_root/fstab"
          if grep -q ' /mnt/nas/' "$ci_mount_root/fstab"; then
            echo 'Unmapped NAS mount target in fstab example' >&2
            exit 1
          fi
          findmnt --verify --tab-file "$ci_mount_root/fstab"

      - name: Check committed whitespace
        run: git diff-tree --check --root -m -r --no-commit-id HEAD

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
